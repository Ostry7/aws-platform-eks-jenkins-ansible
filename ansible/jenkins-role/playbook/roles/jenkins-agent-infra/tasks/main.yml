---
  - name: Install unzip (needed for terraform binary)
    apt:
      name: unzip
      state: present

  - name: Download Terraform
    get_url:
      url: https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip
      dest: /tmp/terraform.zip
      force:  true

  - name: Unzip Terraform
    unarchive:
      src: /tmp/terraform.zip
      dest: /usr/local/bin
      remote_src: true
      mode: '0755'

  - name: Install AWS CLI
    apt:
      name: awscli
      state: present

  - name: Allow passwordless sudo for jenkins agent user
    lineinfile:
      path: /etc/sudoers.d/jenkins-agent
      line: "jenkins ALL=(ALL) NOPASSWD:ALL"
      create: yes
      validate: 'visudo -cf %s'
      mode: '0440'