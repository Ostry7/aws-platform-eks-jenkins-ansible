apiVersion: apps/v1
kind: Deployment
metadata:
  name:  prod-app
  namespace: default
  labels:
    app:  prod-app
spec:
  selector:
    matchLabels:
      app: prod-app
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app:  prod-app
    spec:
      containers:
      - name: prod-app
        image: ${IMAGE}
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: db-credentials
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
     