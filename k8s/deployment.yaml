apiVersion: apps/v1
kind: Deployment
metadata:
  name:  prod_app
  namespace: default
  labels:
    app:  prod_app
spec:
  selector:
    matchLabels:
      app: prod_app
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app:  prod_app
    spec:
      # initContainers:
        # Init containers are exactly like regular containers, except:
          # - Init containers always run to completion.
          # - Each init container must complete successfully before the next one starts.
      containers:
      - name:  prod_app
        image:  ${IMAGE}
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi

     